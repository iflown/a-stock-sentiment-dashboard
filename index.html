<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股情绪监控仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root{
    --up:#d8392b; --down:#1a9e5f; --bg:#0f1320; --panel:#171c2e;
    --line:#2a3150; --text:#e7ebf5; --sub:#9aa3bd; --accent:#4f7cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px;line-height:1.5}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px}
  header h1{font-size:22px;font-weight:700}
  header .meta{color:var(--sub);font-size:13px}
  header .src{color:var(--accent);font-size:12px;border:1px solid var(--line);padding:2px 8px;border-radius:10px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .name{color:var(--sub);font-size:13px}
  .kpi .val{font-size:22px;font-weight:700;margin:4px 0 2px}
  .kpi .chg{font-size:14px;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .card h3{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:10px}
  .chart{width:100%;height:340px}
  .chart.tall{height:380px}
  select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
  .metrics{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
  .metric{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
  .metric .k{color:var(--sub);font-size:12px}
  .metric .v{font-size:18px;font-weight:700;margin-top:2px}
  footer{color:var(--sub);font-size:12px;margin-top:8px;line-height:1.7}
  .up{color:var(--up)} .down{color:var(--down)}
</style>
</head>

<header>
  <h1>A股情绪监控仪表盘</h1>
  <span class="meta" id="updated"></span>
  <span class="src">数据来源：Wind 万得</span>

<section class="kpis" id="kpis"></section>

<section class="card">

  <div id="chartBase" class="chart tall"></div>
</section>

<div class="grid">
  <section class="card">

    <div id="chartInterval" class="chart tall"></div>
  </section>
  <section class="card">
    <h3>行业净值走势（2021 = 100）
      <select id="sectorSel"></select>
    </h3>
    <div id="chartSector" class="chart tall"></div>
  </section>
</div>

<section class="card">
  <h3>今日行业涨跌榜（申万一级，按当日涨跌幅 %）</h3>
  <div id="chartRank" class="chart"></div>
</section>

<section class="card">
  <h3>盘后情绪评分</h3>

    <div id="gauge" class="chart" style="width:320px;height:260px;flex:0 0 auto"></div>
    <div id="sentimentMetrics" class="metrics" style="flex:1"></div>
  </div>
</section>

<footer id="footer"></footer>

function chgPct(arr){
  if(!arr||arr.length<2) return null;
  const a=arr[arr.length-1], b=arr[arr.length-2];
  if(a==null||b==null||!b) return null;
  return (a-b)/b*100;
}
function intervalPct(arr){
  const a=arr[arr.length-1];
  let base=null;
  for(const v of arr){ if(v!=null){base=v;break;} }
  if(a==null||base==null||!base) return null;
  return (a-base)/base*100;
}
function norm100(arr){
  let base=null;
  for(const v of arr){ if(v!=null){base=v;break;} }
  if(base==null) return arr;
  return arr.map(v=> v==null?null : +(v/base*100).toFixed(2));
}
function fmt(v){ return v==null?'—':v.toFixed(2); }

  const cls = c>0?'up':(c<0?'down':'');
  const sign = c>0?'+':'';
  const div = document.createElement('div');
  div.className='kpi';
  div.innerHTML = `<div class="name">${name}</div>`+
    `<div class="val">${fmt(v)}</div>`+
    `<div class="chg ${cls}">${c==null?'—':sign+c.toFixed(2)+'%'}</div>`;
  kpiBox.appendChild(div);
});

  northHtml;

// 自适应
window.addEventListener('resize', ()=>{[baseChart,intervalChart,sectorChart,rankChart,gauge].forEach(c=>c.resize());});
</script>
</body>
